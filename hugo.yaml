# 网址：部署到 Cloudflare Pages 后，改成你的 xxx.pages.dev 或自定义域名
baseURL: "https://example.org/"
languageCode: "zh-cn"
defaultContentLanguage: "zh"
title: "Shibo 的博客"
theme: "PaperMod"
enableEmoji: true
enableRobotsTXT: true

params:
  env: production
  defaultTheme: auto          # auto = 跟随系统深浅色
  ShowReadingTime: true       # 显示阅读时长
  ShowPostNavLinks: true      # 上一篇/下一篇导航
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true   # 代码块一键复制
  ShowToc: true               # 文章目录
  homeInfoParams:
    Title: "你好，这里是 Shibo 👋"
    Content: >
      记录嵌入式 / 机器人 / 硬件折腾的学习笔记与项目复盘。

menu:
  main:
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 5
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 10
    - identifier: about
      name: 关于
      url: /about/
      weight: 15

markup:
  goldmark:
    renderer:
      unsafe: true            # 允许在 Markdown 里写内嵌 HTML
  highlight:
    codeFences: true
    style: monokai            # 代码块配色，可换 dracula / github 等
